<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/avatar.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Runs Project Logos — open defensive cybersecurity, kept open and run on generally available models. Made TideSurf and Agent-Estate." />
  <meta name="theme-color" content="#060912" />
  <link rel="alternate" type="application/atom+xml" title="MercuriusDream writings" href="/atom.xml" />
  <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zalando+Sans:wght@400;500&family=Gothic+A1:wght@400;500&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=block"
    rel="stylesheet">

  <title>마라향 안개구름</title>

  <script>
    // Apply the saved/preferred theme before first paint (no flash).
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'day';
        if (t === 'day') {
          document.documentElement.dataset.theme = 'day';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#E8ECF4');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { color-scheme: dark; }
    html[data-theme='day'] { color-scheme: light; }
    html body {
      --sky: #060912;
      --star: #E8EAF0;
      background: var(--sky);
      color: var(--star);
    }
    html[data-theme='day'] body { --sky: #E8ECF4; --star: #161C2B; }
    body {
      font-family: 'Zalando Sans', 'Gothic A1', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #root:empty::before {
      content: '';
      position: fixed;
      inset: 0;
      background: var(--sky);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
