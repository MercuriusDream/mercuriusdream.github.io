<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/avatar.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MercuriusDream — security researcher, reverse engineer, systems writer." />
  <meta name="theme-color" content="#ECEDEA" />
  <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zalando+Sans:wght@400;500&family=Gothic+A1:wght@400;500&display=swap"
    rel="stylesheet">

  <title>마라향 안개구름</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html[data-theme="light"] {
      --paper: #ECEDEA;
      --ink: #161716;
    }
    html[data-theme="dark"] {
      --paper: #1A1A18;
      --ink: #E8E9E6;
    }
    html[data-theme="light"] body {
      background: var(--paper);
      color: var(--ink);
    }
    html[data-theme="dark"] body {
      background: var(--paper);
      color: var(--ink);
    }
    body {
      font-family: 'Zalando Sans', 'Gothic A1', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    #root:empty::before {
      content: '';
      position: fixed;
      inset: 0;
    }
    #root:empty::before { background: var(--paper); }
  </style>
  <script>
    (function() {
      const stored = localStorage.getItem('theme');
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      const theme = stored === 'light' || stored === 'dark' ? stored : systemTheme;
      const root = document.documentElement;
      root.setAttribute('data-theme', theme);
      const meta = document.querySelector('meta[name="theme-color"]');
      const paper = getComputedStyle(root).getPropertyValue('--paper').trim();
      if (meta && paper) meta.setAttribute('content', paper);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
